services:
  db:
    image: mysql:8.0.37-oracle
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      # Connect from the host at 127.0.0.1:3307 (3306 is often taken locally)
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Runs only when the data volume is first created.
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    entrypoint: ["uv", "run", "python", "manage.py"]
    command: ["runserver", "0.0.0.0:8000"]
    volumes:
      # Live source code: edits on the host are used without rebuilding,
      # and runserver auto-reloads on changes.
      - ./src:/app/src
      # Mounted so `uv run` syncs dependency changes without a rebuild.
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./uv.lock:/app/uv.lock:ro
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql-data:
